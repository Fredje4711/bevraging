<script>
"use strict";
const questions = JSON.parse(document.getElementById("questionData").textContent);
const selected = new Set();
const $ = id => document.getElementById(id);
const letters = "ABCD";
function el(tag, text, className) { const n=document.createElement(tag); if(text!==undefined)n.textContent=text;if(className)n.className=className;return n; }
function selectionText() {
 const list=questions.filter(q=>selected.has(q.id));
 const lines=["QUIZKEUZE LEDENFEEST — DIABETES LIGA MIDDEN-LIMBURG","Gekozen voorstelnummers: "+list.map(q=>questions.indexOf(q)+1).join(", "),""];
 list.forEach((q,i)=>{lines.push((i+1)+". Voorstel "+(questions.indexOf(q)+1)+" — bron "+q.id,q.question,...q.options.map((o,j)=>letters[j]+". "+o),"Juiste antwoord: "+letters[q.correctOption]+". "+q.options[q.correctOption],"");});
 return lines.join("\r\n");
}
function refresh() {
 const size=selected.size;
 $("count").textContent=size+" van 10 gekozen";
 $("exportText").disabled=size!==10;
 for(const q of questions){
  const chosen=selected.has(q.id);
  $("pick-"+q.id).checked=chosen;
  $("card-"+q.id).classList.toggle("chosen",chosen);
 }
}
let group="";
questions.forEach((q,i)=>{
 if(q.group!==group){group=q.group;$("questions").append(el("h2",group,"section-title"));}
 const card=el("article",undefined,"question");card.id="card-"+q.id;
 const meta=el("div",undefined,"meta");meta.append(el("span","Voorstel "+String(i+1).padStart(2,"0")+" / 20"));
 if(q.challenge)meta.append(el("span","Iets moeilijker","badge"));
 const heading=el("h3",q.question);heading.id="title-"+q.id;card.setAttribute("aria-labelledby",heading.id);
 const options=el("ul",undefined,"options");
 q.options.forEach((o,j)=>{const li=el("li");li.append(el("span",letters[j]+".","letter"),el("span",o));options.append(li);});
 const label=el("label",undefined,"pick");const box=el("input");box.type="checkbox";box.id="pick-"+q.id;box.setAttribute("aria-label","Kies voorstel "+(i+1)+": "+q.question);
 box.addEventListener("change",()=>{
  if(box.checked && selected.size>=10){box.checked=false;$("status").textContent="U hebt al 10 vragen gekozen. Vink eerst een andere vraag uit.";return;}
  if(box.checked)selected.add(q.id);else selected.delete(q.id);
  $("status").textContent=selected.size===10?"Uw 10 vragen zijn klaar om op te slaan.":"Keuze aangepast: "+selected.size+" van 10 vragen.";
  refresh();
 });
 label.append(box,el("span","Deze vraag kiezen"));
 const detail=el("details");detail.append(el("summary","Juiste antwoord bekijken"),el("p",letters[q.correctOption]+". "+q.options[q.correctOption]));
 card.append(meta,heading,options,label,detail);$("questions").append(card);
});
function download(content,type,filename){
 const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=el("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function stamp(){return new Date().toISOString().slice(0,10);}
$("exportText").addEventListener("click",()=>{
 if(selected.size!==10)return;
 try{download("\uFEFF"+selectionText(),"text/plain;charset=utf-8","quizkeuze-ledenfeest-"+stamp()+".txt");$("status").textContent="Download gestart: quizkeuze-ledenfeest-"+stamp()+".txt";}
 catch(e){$("status").textContent="Opslaan is niet gelukt. Probeer opnieuw in Chrome of Edge.";}
});
refresh();
</script>
